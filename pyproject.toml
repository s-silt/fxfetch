[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fxfetch"
version = "0.1.0"
description = "Local distribution-link acquisition and web APK service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "Pillow>=11,<14",
  "zxing-cpp>=2.3,<4",
  "tldextract>=5.1,<6",
  "cryptography>=44",
  "filelock>=3.0.8,<5",
  "dnspython==2.9.0",
  "pillow-heif>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9", "pyright>=1.1", "qrcode>=8,<9"]
browser = ["playwright>=1.64.1,<2"]

[project.scripts]
fxfetch = "fxfetch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fxfetch = ["web/static/*", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
